[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "ci-failure-analyzer"
version = "0.1.0"
description = "Analyze and summarize CI/CD pipeline failures."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Your Name", email = "you@example.com" },
]

keywords = [
    "ci",
    "cd",
    "cicd",
    "github-actions",
    "devops",
    "pipeline",
    "failure-analysis",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]


[project.optional-dependencies]

github = [
    "PyGithub>=2.3,<3.0",
]

llm = [
    "openai>=1.0,<2.0",
]

dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<5.0",
]

all = [
    "ci-failure-analyzer[github,llm,dev]",
]


[project.urls]
Homepage = "https://github.com/your-org/ci-failure-analyzer"
Repository = "https://github.com/your-org/ci-failure-analyzer"
Issues = "https://github.com/your-org/ci-failure-analyzer/issues"


[project.scripts]
ci-failure-analyzer = "ci_failure_analyzer.cli:main"


[tool.setuptools]
include-package-data = true
packages = ["hospitalmanage_triage_env", "hospitalmanage_triage_env.server"]
package-dir = { "hospitalmanage_triage_env" = ".", "hospitalmanage_triage_env.server" = "server" }